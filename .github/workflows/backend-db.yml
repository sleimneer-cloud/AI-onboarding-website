name: Backend DB

on:
  pull_request:
    paths:
      - "backend/**"
      - "docs/DATA_MODEL.md"
      - "docs/DECISIONS.md"
      - "docs/API_CONTRACT.md"
      - "docs/DEMO_SCENARIO.md"
      - "docs/IMPLEMENTATION_ROADMAP.md"
      - ".github/workflows/backend-db.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "docs/DATA_MODEL.md"
      - "docs/DECISIONS.md"
      - "docs/API_CONTRACT.md"
      - "docs/DEMO_SCENARIO.md"
      - "docs/IMPLEMENTATION_ROADMAP.md"
      - ".github/workflows/backend-db.yml"
  workflow_dispatch:

jobs:
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ix_value_loop_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ix_value_loop_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ix_value_loop_test
      TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@127.0.0.1:5432/ix_value_loop_test
      DEMO_ACCOUNT_PASSWORD: TestDemoPassword!
      DEMO_REFERENCE_DATE: 2026-08-02

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        run: python -m pip install -e "backend[dev]"

      - name: Ruff
        run: python -m ruff check backend

      - name: Backend tests with PostgreSQL 16
        run: python -m pytest backend/tests
